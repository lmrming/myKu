# Redis 配置文件
# 针对 myku 项目优化

# ============================================
# 基础配置
# ============================================

# 绑定地址（开发环境允许所有，生产环境限制）
bind 0.0.0.0

# 端口
port 6379

# 密码认证（生产环境必须设置）
# requirepass your_strong_password

# 最大客户端连接数
maxclients 1000

# 守护进程模式（Docker 中设置为 no）
daemonize no

# 日志级别
loglevel notice

# ============================================
# 内存管理
# ============================================

# 最大内存限制（根据服务器配置调整）
maxmemory 256mb

# 内存淘汰策略
# allkeys-lru: 最近最少使用的键优先淘汰
maxmemory-policy allkeys-lru

# ============================================
# 持久化配置 - RDB
# ============================================

# 开启 RDB 持久化
save 900 1      # 900秒内至少有1个key变化
save 300 10     # 300秒内至少有10个key变化
save 60 10000   # 60秒内至少有10000个key变化

# RDB 文件名
dbfilename dump.rdb

# RDB 文件保存路径
dir /data

# 压缩 RDB 文件
rdbcompression yes

# RDB 文件校验
rdbchecksum yes

# ============================================
# 持久化配置 - AOF
# ============================================

# 开启 AOF 持久化
appendonly yes

# AOF 文件名
appendfilename "appendonly.aof"

# AOF 同步策略
# everysec: 每秒同步（推荐，平衡性能和安全）
appendfsync everysec

# AOF 重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# 性能优化
# ============================================

# 使用更高效的数据结构
ezhash-max-ziplist-entries 512
ezhash-max-ziplist-value 64

list-max-ziplist-size -2

set-max-intset-entries 512

zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# 启用哈希表重新编码
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# ============================================
# 安全配置
# ============================================

# 禁用危险命令（生产环境建议）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command DEBUG ""

# 启用保护模式
protected-mode yes

# ============================================
# 慢查询日志
# ============================================

# 慢查询阈值（微秒）
slowlog-log-slower-than 10000

# 慢查询日志长度
slowlog-max-len 128

# ============================================
# 客户端超时
# ============================================

# 客户端空闲超时时间（0表示不超时）
timeout 300

# TCP keepalive
tcp-keepalive 300
