<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.show {
            display: block;
        }
        .test-account {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-account h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .test-account p {
            color: #666;
            font-size: 13px;
            margin: 4px 0;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .db-check {
            margin-top: 20px;
            padding: 16px;
            background: #e3f2fd;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }
        .db-check h4 {
            color: #1976D2;
            margin-bottom: 10px;
        }
        .db-check pre {
            background: #fff;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 注册测试工具</h1>
        
        <div class="test-account">
            <h3>📋 推荐测试账号信息</h3>
            <p><strong>用户名：</strong>testuser2024</p>
            <p><strong>密码：</strong>Test123456</p>
            <p><strong>邮箱：</strong>test2024@example.com</p>
            <p><strong>年龄：</strong>25</p>
            <p><strong>出生年月：</strong>1999-05</p>
            <p><strong>地址：</strong>北京市朝阳区测试路123号</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" name="username" id="username" required placeholder="testuser2024">
            </div>
            
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" name="password" id="password" required placeholder="Test123456" minlength="6">
            </div>
            
            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="再次输入密码">
            </div>
            
            <div class="form-group">
                <label>性别</label>
                <select name="gender" id="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>年龄 *</label>
                <input type="number" name="age" id="age" required placeholder="25" min="1" max="120">
            </div>
            
            <div class="form-group">
                <label>出生年月 *</label>
                <input type="month" name="birth" id="birth" required value="1999-05">
            </div>
            
            <div class="form-group">
                <label>邮箱 *</label>
                <input type="email" name="email" id="email" required placeholder="test2024@example.com">
            </div>
            
            <div class="form-group">
                <label>家庭住址 *</label>
                <input type="text" name="address" id="address" required placeholder="北京市朝阳区测试路123号">
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                立即注册测试
            </button>
        </form>
        
        <div id="result" class="result"></div>
        
        <div class="db-check">
            <h4>🔍 验证方法</h4>
            <p>注册成功后，请在终端执行以下命令验证数据库：</p>
            <pre>mysql -u root -proot -e "USE myku_app; SELECT * FROM users WHERE username='你的用户名';"</pre>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            
            // 获取表单数据
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                gender: document.getElementById('gender').value,
                age: parseInt(document.getElementById('age').value),
                birth: document.getElementById('birth').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                hobbies: []
            };
            
            // 验证密码
            if (formData.password !== formData.confirmPassword) {
                result.className = 'result error show';
                result.textContent = '❌ 两次输入的密码不一致';
                return;
            }
            
            // 显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>注册中...';
            result.className = 'result';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success show';
                    result.innerHTML = `
                        <strong>✅ 注册成功！</strong><br><br>
                        <strong>用户ID：</strong>${data.user.id}<br>
                        <strong>用户名：</strong>${data.user.username}<br>
                        <strong>邮箱：</strong>${data.user.email}<br>
                        <strong>创建时间：</strong>${data.user.created_at}<br><br>
                        <small>数据已成功保存到数据库！</small>
                    `;
                    
                    // 清空表单
                    document.getElementById('registerForm').reset();
                } else {
                    throw new Error(data.error || '注册失败');
                }
            } catch (error) {
                result.className = 'result error show';
                result.innerHTML = `<strong>❌ 注册失败</strong><br>${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '立即注册测试';
            }
        });
        
        // 自动填充测试数据
        document.getElementById('username').value = 'testuser2024';
        document.getElementById('password').value = 'Test123456';
        document.getElementById('confirmPassword').value = 'Test123456';
        document.getElementById('age').value = '25';
        document.getElementById('email').value = 'test2024@example.com';
        document.getElementById('address').value = '北京市朝阳区测试路123号';
    </script>
</body>
</html>
